# Publishes the built site in wwwroot to GitHub Pages at dexvision.pro.
# Rebuild it first with `npm run build` in web/frontend and commit wwwroot.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['wwwroot/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the site
        run: |
          mkdir _site
          cp -r wwwroot/. _site/
          # Pages has no rewrites: unknown paths such as /token/r/gnoswap/gns.GNS get the token page
          cp _site/token/index.html _site/404.html
          echo dexvision.pro > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
